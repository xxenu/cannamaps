# Publishes public/ as the site root.
#
# GitHub's "deploy from a branch" option can only serve / or /docs, and the app
# lives in public/ — without this, Pages finds no index.html at the repo root
# and renders README.md instead.
#
# Requires Settings -> Pages -> Source = "GitHub Actions" (one-time).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
